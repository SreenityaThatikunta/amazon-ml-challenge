name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          grep -vE '^(--extra-index-url|torch==)' code/business_entity_resolution/requirements.txt > /tmp/req.txt
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/req.txt
      - name: Run tests
        run: |
          mkdir -p dataset   # the pipeline finds the project root by this folder; no data is needed
          python -m pytest code/business_entity_resolution/src/tests -q
