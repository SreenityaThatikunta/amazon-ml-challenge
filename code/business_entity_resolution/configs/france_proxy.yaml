# France validation proxy (T5.1): the pipeline on synthetic labelled French data
# (`ber synth-france --run main` first), scored with the model trained in run `main`.
extends: default.yaml

run_id: synthfr
paths:
  data_dir: artifacts/main/synth-france/data
data:
  split_run: synthfr
  with_test: false
split:                # everything is validation
  val_frac: 1.0
  dev_train_frac: 0.0
  dev_val_frac: 0.0
features:
  train_query_frac: 0.0
scorer:
  model_from_run: main  # apply the US/India model: measures generalisation to France
  oof_folds: 1
